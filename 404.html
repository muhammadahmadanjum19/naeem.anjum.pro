<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <script>
        // Automatically redirects missing sub-routes back to index or handles path mapping
        const path = window.location.pathname;
        if (path.includes('physics.html')) {
            window.location.replace('physics.html');
        } else {
            window.location.replace('index.html');
        }
    </script>
</head>
<body style="background:#0B0B0C; color:#FDFBF7; font-family:sans-serif; text-align:center; padding-top:20vh;">
    <h2>Redirecting to Executive Portal...</h2>
</body>
</html>
